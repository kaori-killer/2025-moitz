name: FE CI

on:
  push:
    branches:
      - fe-prod
      - fe-dev
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  workflow_call:
    outputs:
      artifact-name:
        description: '빌드 결과물 아티팩트 이름'
        value: ${{ jobs.build.outputs.artifact-name }}

jobs:
  build:
    outputs:
      artifact-name: build-result
    if: >
      github.actor == 'kaori-killer' || 
      github.actor == 'eunsoA' || 
      github.event.pull_request.user.login == 'kaori-killer' || 
      github.event.pull_request.user.login == 'eunsoA'
    runs-on: ubuntu-latest
    environment: ${{ (github.ref == 'refs/heads/fe-prod' || github.base_ref == 'fe-prod') && 'prod' || 'dev' }}
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v3

      - name: Node.js 설정
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: .env 파일 생성
        run: |
          echo "NAVER_MAP_API_KEY=${{ secrets.NAVER_MAP_API_KEY }}" > .env
          echo "API_BASE_URL=${{ secrets.API_BASE_URL }}" >> .env
          echo "GOOGLE_ANALYTICS_TRACKING_ID=${{ secrets.GOOGLE_ANALYTICS_TRACKING_ID }}" >> .env
          echo "CLARITY_ID=${{ secrets.CLARITY_ID }}" >> .env
          echo "SENTRY_DSN=${{ secrets.SENTRY_DSN }}" >> .env

      - name: .env 파일 검증 (디버깅용)
        run: |
          echo "=== .env 파일 존재 확인 ==="
          ls -la .env
          echo "=== .env 파일 내용 (값은 마스킹) ==="
          if [ -f .env ]; then
            while IFS='=' read -r key value; do
              if [ -n "$key" ]; then
                echo "$key=***"
              fi
            done < .env
          else
            echo "❌ .env 파일이 존재하지 않습니다!"
            exit 1
          fi
          echo "=== API_BASE_URL 확인 ==="
          if grep -q "API_BASE_URL=" .env; then
            echo "✅ API_BASE_URL이 .env에 존재합니다"
          else
            echo "❌ API_BASE_URL이 .env에 없습니다!"
            exit 1
          fi

      - name: 코드 린트 검사
        run: npx eslint --ext .js,.jsx,.ts,.tsx src

      - name: 문법 확인 (컴파일)
        run: npx tsc --noEmit -p tsconfig.json

      - name: 테스트 및 커버리지 확인
        run: npx jest --verbose --coverage

      - name: 빌드 실행 (fe-prod)
        if: (github.event_name == 'push' && github.ref == 'refs/heads/fe-prod') || (github.event_name == 'pull_request' && github.base_ref == 'fe-prod') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/fe-prod')
        run: npm run build:prod

      - name: 빌드 결과물 검증 (디버깅용 - prod)
        if: (github.event_name == 'push' && github.ref == 'refs/heads/fe-prod') || (github.event_name == 'pull_request' && github.base_ref == 'fe-prod') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/fe-prod')
        run: |
          echo "=== 빌드 결과물 확인 ==="
          ls -la dist/
          echo "=== JS 파일에 API_BASE_URL이 포함되어 있는지 확인 ==="
          if grep -rq "API_BASE_URL\|process\.env\.API_BASE_URL" dist/*.js 2>/dev/null; then
            echo "⚠️  경고: JS 파일에 'API_BASE_URL' 문자열이 그대로 남아있습니다 (환경 변수가 제대로 주입되지 않았을 수 있습니다)"
          else
            echo "✅ 빌드 파일에 환경 변수가 주입된 것으로 보입니다"
          fi
          echo "=== index.html 확인 ==="
          if [ -f dist/index.html ]; then
            echo "✅ index.html이 생성되었습니다"
            head -n 20 dist/index.html
          else
            echo "❌ index.html이 생성되지 않았습니다!"
            exit 1
          fi

      - name: 빌드 실행 (fe-dev)
        if: (github.event_name == 'push' && github.ref == 'refs/heads/fe-dev') || (github.event_name == 'pull_request' && github.base_ref == 'fe-dev') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/fe-dev')
        run: npm run build:dev

      - name: 빌드 결과물 검증 (디버깅용 - dev)
        if: (github.event_name == 'push' && github.ref == 'refs/heads/fe-dev') || (github.event_name == 'pull_request' && github.base_ref == 'fe-dev') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/fe-dev')
        run: |
          echo "=== 빌드 결과물 확인 ==="
          ls -la dist/
          echo "=== JS 파일에 API_BASE_URL이 포함되어 있는지 확인 ==="
          if grep -rq "API_BASE_URL\|process\.env\.API_BASE_URL" dist/*.js 2>/dev/null; then
            echo "⚠️  경고: JS 파일에 'API_BASE_URL' 문자열이 그대로 남아있습니다 (환경 변수가 제대로 주입되지 않았을 수 있습니다)"
          else
            echo "✅ 빌드 파일에 환경 변수가 주입된 것으로 보입니다"
          fi
          echo "=== index.html 확인 ==="
          if [ -f dist/index.html ]; then
            echo "✅ index.html이 생성되었습니다"
            head -n 20 dist/index.html
          else
            echo "❌ index.html이 생성되지 않았습니다!"
            exit 1
          fi

      - name: 빌드 결과물 업로드
        uses: actions/upload-artifact@v4
        with:
          name: build-result
          path: frontend/dist
          retention-days: 1
