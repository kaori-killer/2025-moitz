name: FE CI

on:
  push:
    branches:
      - fe-prod
      - fe-dev
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  workflow_call:
    outputs:
      artifact-name:
        description: '빌드 결과물 아티팩트 이름'
        value: ${{ jobs.build.outputs.artifact-name }}

jobs:
  build:
    outputs:
      artifact-name: build-result
    if: >
      github.actor == 'kaori-killer' || 
      github.actor == 'eunsoA' || 
      github.event.pull_request.user.login == 'kaori-killer' || 
      github.event.pull_request.user.login == 'eunsoA'
    runs-on: ubuntu-latest
    environment: ${{ (github.ref == 'refs/heads/fe-prod' || github.base_ref == 'fe-prod') && 'production' || 'development' }}
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v3

      - name: Node.js 설정
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: .env 파일 생성
        run: |
          echo "NAVER_MAP_API_KEY=${{ secrets.NAVER_MAP_API_KEY }}" > .env
          echo "GOOGLE_ANALYTICS_TRACKING_ID=${{ secrets.GOOGLE_ANALYTICS_TRACKING_ID }}" >> .env
          echo "CLARITY_ID=${{ secrets.CLARITY_ID }}" >> .env
          echo "SENTRY_DSN=${{ secrets.SENTRY_DSN }}" >> .env

          # 브랜치/타깃에 따라 PROD / DEV API_BASE_URL 분리
          if [[ "${GITHUB_REF##*/}" == "fe-prod" || "${GITHUB_BASE_REF}" == "fe-prod" ]]; then
            echo "NODE_ENV=production" >> .env
            echo "PROD_API_BASE_URL=${{ secrets.PROD_API_BASE_URL }}" >> .env
          else
            echo "NODE_ENV=development" >> .env
            echo "DEV_API_BASE_URL=${{ secrets.DEV_API_BASE_URL }}" >> .env
          fi

      - name: 코드 린트 검사
        run: npx eslint --ext .js,.jsx,.ts,.tsx src

      - name: 문법 확인 (컴파일)
        run: npx tsc --noEmit -p tsconfig.json

      - name: 테스트 및 커버리지 확인
        run: npx jest --verbose --coverage

      - name: 빌드 실행 (fe-prod)
        if: (github.event_name == 'push' && github.ref == 'refs/heads/fe-prod') || (github.event_name == 'pull_request' && github.base_ref == 'fe-prod') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/fe-prod')
        run: npm run build:prod

      - name: 빌드 실행 (fe-dev)
        if: (github.event_name == 'push' && github.ref == 'refs/heads/fe-dev') || (github.event_name == 'pull_request' && github.base_ref == 'fe-dev') || (github.event_name == 'workflow_dispatch')
        run: npm run build:dev

      - name: 빌드 결과물 업로드
        uses: actions/upload-artifact@v4
        with:
          name: build-result
          path: frontend/dist
          retention-days: 1
